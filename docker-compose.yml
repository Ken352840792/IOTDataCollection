version: '3.8'

services:
  # MySQL数据库服务
  iot-mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: iot123456
      MYSQL_DATABASE: IoTDataCollection_Main
      MYSQL_USER: iot_user
      MYSQL_PASSWORD: iot123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql:/docker-entrypoint-initdb.d
    networks:
      - iot_network

  # Node-RED服务端规则引擎
  node-red:
    image: nodered/node-red:latest
    container_name: iot-nodered
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "1880:1880"
    volumes:
      - node_red_data:/data
      - ./node-red/flows:/data/flows
      - ./node-red/settings:/data/settings
    networks:
      - iot_network
    depends_on:
      - iot-mysql

  # Redis缓存服务（可选，用于ABP缓存）
  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot_network

  # InfluxDB时序数据库服务
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    restart: always
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=iot123456
      - DOCKER_INFLUXDB_INIT_ORG=IOTDataCollection
      - DOCKER_INFLUXDB_INIT_BUCKET=iot_data
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=iot-admin-token-12345678901234567890
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - iot_network

  # NanoMQ MQTT消息队列服务
  nanomq:
    image: emqx/nanomq:0.21.1-slim
    container_name: iot-nanomq
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "1883:1883"    # MQTT端口
      - "8083:8083"    # WebSocket端口
      - "18083:18083"  # 管理面板端口
    volumes:
      - nanomq_data:/opt/nanomq/data
      - ./mqtt/nanomq.conf:/etc/nanomq.conf
    networks:
      - iot_network
    command: ["nanomq", "start", "--conf", "/etc/nanomq.conf"]

volumes:
  mysql_data:
  node_red_data:
  redis_data:
  influxdb_data:
  influxdb_config:
  nanomq_data:

networks:
  iot_network:
    driver: bridge 